<body>
  <main class="card">
    <p class="eyebrow">Contacto</p>
    <h1>Hablemos</h1>
    <p class="intro">Puedes escribirme mediante este formulario de ejemplo.</p>
    <form action="mailto:rafaelvegalibrero@gmail.com" method="post" enctype="text/plain">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" autocomplete="name" required>

      <button class="button" type="submit">Enviar</button>
    </form>
